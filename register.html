{% extends 'base.html' %}

{% block title %}Register — DeepGuard AI{% endblock %}

{% block content %}
<div class="container py-5 my-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="fs-1 text-cyan mb-2">🛡️</div>
                    <h3 class="fw-bold text-light">Create Account</h3>
                    <p class="text-muted small">Register to start verifying images and videos with DeepGuard AI.</p>
                </div>

                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="form-group mb-3">
                        <label class="form-label"><i class="fas fa-user me-1 text-cyan"></i> Full Name</label>
                        <input type="text" name="name" class="form-input" placeholder="Alex Morgan" required>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label"><i class="fas fa-envelope me-1 text-cyan"></i> Email Address</label>
                        <input type="email" name="email" class="form-input" placeholder="alex@company.com" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label"><i class="fas fa-lock me-1 text-cyan"></i> Password</label>
                            <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"><i class="fas fa-check-double me-1 text-cyan"></i> Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-cyber w-100 justify-content-center py-2 fs-6 mt-2">
                        <i class="fas fa-user-plus me-2"></i> Register Account
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top border-secondary-subtle text-center text-muted small">
                    Already registered? <a href="{{ url_for('auth.login') }}" class="text-cyan fw-semibold text-decoration-none">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
