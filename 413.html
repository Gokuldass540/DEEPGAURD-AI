{% extends 'base.html' %}

{% block title %}File Too Large — DeepGuard AI{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="glass-card py-5 px-4 max-w-md mx-auto" style="max-width: 500px;">
        <div class="display-1 font-monospace text-warning fw-bold mb-3">413</div>
        <h3 class="text-light fw-bold mb-3">File Size Exceeds Limit</h3>
        <p class="text-muted small mb-4">The uploaded file exceeds the maximum permitted limit of 50 MB. Please compress or trim your video/image and try again.</p>
        <a href="{{ url_for('detection.detection_page') }}" class="btn btn-cyber">
            <i class="fas fa-upload me-2"></i> Try Another File
        </a>
    </div>
</div>
{% endblock %}
